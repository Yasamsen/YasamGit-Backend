<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>YasamGit V5.2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  width: min(1100px, calc(100% - 30px));
  margin: auto;
}

header {
  background: #111827;
  border-bottom: 1px solid #1e293b;
}

.nav {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: white;
}

.logo span {
  color: #60a5fa;
}

main {
  padding: 30px 0;
}

.card {
  background: #111827;
  border: 1px solid #1e293b;
  border-radius: 15px;
  padding: 22px;
  margin-bottom: 20px;
}

h1,
h2,
h3 {
  color: white;
}

input,
textarea,
select {
  width: 100%;
  padding: 11px;
  border-radius: 9px;
  border: 1px solid #334155;
  background: #020617;
  color: white;
  outline: none;
}

textarea {
  min-height: 300px;
  resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #60a5fa;
}

label {
  display: block;
  margin: 12px 0 7px;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

button:hover {
  background: #1d4ed8;
}

button.danger {
  background: #dc2626;
}

button.secondary {
  background: #334155;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.row > * {
  flex: 1;
}

.hidden {
  display: none !important;
}

.message {
  margin-top: 12px;
  padding: 10px;
  border-radius: 9px;
  display: none;
}

.message.show {
  display: block;
}

.success {
  background: #064e3b;
  color: #a7f3d0;
}

.error {
  background: #450a0a;
  color: #fecaca;
}

.repo-item,
.file-item {
  background: #020617;
  border: 1px solid #1e293b;
  padding: 13px;
  border-radius: 10px;
  margin-top: 8px;
}

.repo-item:hover,
.file-item:hover {
  border-color: #3b82f6;
}

.item-title {
  font-weight: bold;
  color: white;
}

.item-meta {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 5px;
}

.actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.actions button {
  padding: 7px 10px;
  font-size: 12px;
}

.status {
  font-size: 13px;
  color: #94a3b8;
}

.online {
  color: #4ade80;
}

.editor {
  margin-top: 20px;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
}

@media(max-width:600px) {
  .nav {
    height: 58px;
  }

  .row {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
<div class="container nav">

  <div class="logo">
    Yasam<span>Git</span>
  </div>

  <div id="status" class="status">
    Checking...
  </div>

</div>
</header>


<main class="container">

<!-- LOGIN -->

<section id="loginPage" class="card">

  <h2>Login YasamGit</h2>

  <p>
    Masukkan password administrator.
  </p>

  <form id="loginForm">

    <label>Password</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <br><br>

    <button type="submit">
      Login
    </button>

  </form>

  <div id="loginMessage" class="message"></div>

</section>


<!-- DASHBOARD -->

<section id="dashboard" class="hidden">

  <div class="card">

    <div class="row">

      <div>
        <h2>Dashboard</h2>
        <span id="userStatus">
          Login berhasil
        </span>
      </div>

      <div>
        <button
          class="danger"
          onclick="logout()"
        >
          Logout
        </button>
      </div>

    </div>

  </div>


  <!-- REPOSITORIES -->

  <div class="card">

    <h2>Repository</h2>

    <div class="row">

      <button onclick="loadRepos()">
        Refresh Repository
      </button>

      <button
        class="secondary"
        onclick="createRepo()"
      >
        + Repository
      </button>

    </div>

    <div id="repos"></div>

  </div>


  <!-- FILE MANAGER -->

  <div
    id="fileManager"
    class="card hidden"
  >

    <h2 id="repoTitle">
      Repository
    </h2>

    <div class="row">

      <input
        id="currentPath"
        placeholder="Path folder/file"
      >

      <button
        onclick="openPath()"
      >
        Open
      </button>

      <button
        class="secondary"
        onclick="newFolder()"
      >
        + Folder
      </button>

      <button
        class="secondary"
        onclick="newFile()"
      >
        + File
      </button>

    </div>

    <div id="files"></div>

  </div>


  <!-- EDITOR -->

  <div
    id="editor"
    class="card hidden"
  >

    <h2>Edit File</h2>

    <input
      id="editPath"
      readonly
    >

    <br><br>

    <textarea
      id="editContent"
    ></textarea>

    <br>

    <div class="row">

      <button onclick="saveFile()">
        Save / Overwrite
      </button>

      <button
        class="secondary"
        onclick="closeEditor()"
      >
        Cancel
      </button>

    </div>

    <div
      id="editorMessage"
      class="message"
    ></div>

  </div>


  <!-- UPLOAD -->

  <div
    id="uploadBox"
    class="card hidden"
  >

    <h2>Upload File</h2>

    <input
      id="uploadFile"
      type="file"
    >

    <br><br>

    <input
      id="uploadPath"
      placeholder="contoh: assets/file.zip"
    >

    <br><br>

    <button onclick="uploadFile()">
      Upload
    </button>

    <div
      id="uploadMessage"
      class="message"
    ></div>

  </div>


  <!-- SEARCH -->

  <div class="card">

    <h2>Search</h2>

    <div class="row">

      <input
        id="searchInput"
        placeholder="Cari repository..."
      >

      <button onclick="search()">
        Search
      </button>

    </div>

    <div id="searchResults"></div>

  </div>

</section>

</main>


<script>

const API = "/api";

let currentRepo = "";
let currentFolder = "";
let currentFileSha = "";


/* =========================
   BASIC API
========================= */

async function request(
  path,
  options = {}
) {

  const response =
    await fetch(
      API + path,
      {
        credentials: "include",
        ...options,

        headers: {
          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );

  let data;

  try {
    data =
      await response.json();
  } catch {
    data = {
      ok: false,
      error:
        "Response backend tidak valid."
    };
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      "Request gagal."
    );
  }

  return data;
}


/* =========================
   STATUS
========================= */

async function checkHealth() {

  try {

    const data =
      await request(
        "/health"
      );

    document.getElementById(
      "status"
    ).textContent =
      "● Backend Online";

    document.getElementById(
      "status"
    ).className =
      "status online";

  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      "● Backend Error";

  }
}


/* =========================
   SESSION
========================= */

async function checkSession() {

  try {

    const data =
      await request(
        "/session"
      );

    if (
      data.authenticated
    ) {

      showDashboard();

      loadRepos();

    } else {

      showLogin();

    }

  } catch {

    showLogin();

  }
}


function showDashboard() {

  document.getElementById(
    "loginPage"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "dashboard"
  ).classList.remove(
    "hidden"
  );
}


function showLogin() {

  document.getElementById(
    "loginPage"
  ).classList.remove(
    "hidden"
  );

  document.getElementById(
    "dashboard"
  ).classList.add(
    "hidden"
  );
}


/* =========================
   LOGIN
========================= */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const password =
        document.getElementById(
          "password"
        ).value;

      try {

        const data =
          await request(
            "/login",
            {
              method: "POST",

              body:
                JSON.stringify({
                  password
                })
            }
          );

        if (data.ok) {

          showMessage(
            "loginMessage",
            "Login berhasil.",
            "success"
          );

          setTimeout(
            () => {

              showDashboard();

              loadRepos();

            },
            300
          );

        }

      } catch (error) {

        showMessage(
          "loginMessage",
          error.message,
          "error"
        );

      }

    }
  );


/* =========================
   LOGOUT
========================= */

async function logout() {

  try {

    await request(
      "/logout",
      {
        method: "POST"
      }
    );

  } catch {}

  currentRepo = "";
  currentFolder = "";

  document.getElementById(
    "repos"
  ).innerHTML = "";

  document.getElementById(
    "files"
  ).innerHTML = "";

  document.getElementById(
    "fileManager"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "editor"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "uploadBox"
  ).classList.add(
    "hidden"
  );

  showLogin();
}


/* =========================
   REPOSITORIES
========================= */

async function loadRepos() {

  const box =
    document.getElementById(
      "repos"
    );

  box.innerHTML =
    "Loading...";

  try {

    const data =
      await request(
        "/repos"
      );

    box.innerHTML = "";

    if (
      !data.repos.length
    ) {

      box.innerHTML =
        "<p>Belum ada repository.</p>";

      return;
    }

    data.repos.forEach(
      repo => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "repo-item";

        div.innerHTML = `
          <div class="item-title">
            ${escapeHtml(repo.name)}
          </div>

          <div class="item-meta">
            ${repo.private ? "Private" : "Public"}
          </div>

          <div class="actions">
            <button onclick="openRepo('${escapeJs(repo.name)}')">
              Open
            </button>

            <button
              class="secondary"
              onclick="window.open('${escapeJs(repo.html_url)}','_blank')"
            >
              GitHub
            </button>
          </div>
        `;

        box.appendChild(div);

      }
    );

  } catch (error) {

    box.innerHTML =
      `<div class="message show error">
        ${escapeHtml(error.message)}
      </div>`;

  }
}


/* =========================
   CREATE REPO
========================= */

async function createRepo() {

  const name =
    prompt(
      "Nama repository:"
    );

  if (!name) return;

  const description =
    prompt(
      "Deskripsi repository:",
      ""
    );

  const privateRepo =
    confirm(
      "Jadikan private?"
    );

  try {

    await request(
      "/repos",
      {
        method: "POST",

        body:
          JSON.stringify({
            name,
            description,
            private:
              privateRepo
          })
      }
    );

    alert(
      "Repository berhasil dibuat."
    );

    loadRepos();

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   OPEN REPO
========================= */

async function openRepo(
  repo
) {

  currentRepo =
    repo;

  currentFolder =
    "";

  document.getElementById(
    "repoTitle"
  ).textContent =
    "Repository: " +
    repo;

  document.getElementById(
    "fileManager"
  ).classList.remove(
    "hidden"
  );

  document.getElementById(
    "uploadBox"
  ).classList.remove(
    "hidden"
  );

  document.getElementById(
    "currentPath"
  ).value =
    "";

  await openPath();

}


/* =========================
   OPEN PATH
========================= */

async function openPath() {

  if (!currentRepo) {

    alert(
      "Pilih repository dulu."
    );

    return;

  }

  const path =
    document.getElementById(
      "currentPath"
    ).value.trim();

  currentFolder =
    path;

  const files =
    document.getElementById(
      "files"
    );

  files.innerHTML =
    "Loading...";

  try {

    const data =
      await request(
        `/repo?repo=${encodeURIComponent(
          currentRepo
        )}&path=${encodeURIComponent(
          path
        )}`
      );

    renderFiles(
      data.data
    );

  } catch (error) {

    files.innerHTML =
      `<div class="message show error">
        ${escapeHtml(error.message)}
      </div>`;

  }
}


/* =========================
   RENDER FILES
========================= */

function renderFiles(
  data
) {

  const box =
    document.getElementById(
      "files"
    );

  box.innerHTML = "";

  if (
    !Array.isArray(data)
  ) {

    box.innerHTML =
      "<p>Path bukan folder.</p>";

    return;

  }

  if (
    currentFolder
  ) {

    const back =
      document.createElement(
        "div"
      );

    back.className =
      "file-item";

    back.innerHTML = `
      <div class="item-title">
        📁 ..
      </div>

      <div class="actions">
        <button
          class="secondary"
          onclick="goParent()"
        >
          Kembali
        </button>
      </div>
    `;

    box.appendChild(
      back
    );
  }

  data
    .sort(
      (a, b) =>
        a.type === b.type
          ? a.name.localeCompare(b.name)
          : a.type === "dir"
            ? -1
            : 1
    )
    .forEach(
      item => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "file-item";

        const icon =
          item.type === "dir"
            ? "📁"
            : "📄";

        div.innerHTML = `
          <div class="item-title">
            ${icon}
            ${escapeHtml(item.name)}
          </div>

          <div class="item-meta">
            ${item.type}
            ${item.size ? " • " + item.size + " bytes" : ""}
          </div>

          <div class="actions">

            ${
              item.type === "dir"
                ? `
                  <button onclick="openFolder('${escapeJs(item.path)}')">
                    Open
                  </button>
                `
                : `
                  <button onclick="editFile('${escapeJs(item.path)}')">
                    Edit
                  </button>

                  <button onclick="previewFile('${escapeJs(item.path)}')">
                    Preview
                  </button>

                  <button onclick="renameItem('${escapeJs(item.path)}')">
                    Rename
                  </button>

                  <button
                    class="danger"
                    onclick="deleteItem('${escapeJs(item.path)}','${escapeJs(item.sha)}')"
                  >
                    Delete
                  </button>
                `
            }

          </div>
        `;

        box.appendChild(
          div
        );

      }
    );
}


/* =========================
   FOLDER
========================= */

async function openFolder(
  path
) {

  document.getElementById(
    "currentPath"
  ).value =
    path;

  await openPath();

}


function goParent() {

  const parts =
    currentFolder
      .split("/")
      .filter(Boolean);

  parts.pop();

  document.getElementById(
    "currentPath"
  ).value =
    parts.join("/");

  openPath();

}


async function newFolder() {

  if (!currentRepo) {
    alert(
      "Pilih repository."
    );
    return;
  }

  const name =
    prompt(
      "Nama folder:"
    );

  if (!name) return;

  const path =
    currentFolder
      ? currentFolder + "/" + name
      : name;

  try {

    await request(
      "/folder",
      {
        method: "POST",

        body:
          JSON.stringify({
            repo:
              currentRepo,
            path
          })
      }
    );

    await openPath();

  } catch (error) {

    alert(
      error.message
    );

  }
}


/* =========================
   NEW FILE
========================= */

function newFile() {

  if (!currentRepo) {
    alert(
      "Pilih repository."
    );
    return;
  }

  const name =
    prompt(
      "Nama file:"
    );

  if (!name) return;

  const path =
    currentFolder
      ? currentFolder + "/" + name
      : name;

  currentFileSha =
    "";

  document.getElementById(
    "editPath"
  ).value =
    path;

  document.getElementById(
    "editContent"
  ).value =
    "";

  document.getElementById(
    "editor"
  ).classList.remove(
    "hidden"
  );

}


/* =========================
   EDIT
========================= */

async function editFile(
  path
) {

  try {

    const data =
      await request(
        `/file?repo=${encodeURIComponent(
          currentRepo
        )}&path=${encodeURIComponent(
          path
        )}`
      );

    currentFileSha =
      data.data.sha;

    document.getElementById(
      "editPath"
    ).value =
      path;

    document.getElementById(
      "editContent"
    ).value =
      data.data.content || "";

    document.getElementById(
      "editor"
    ).classList.remove(
      "hidden"
    );

    window.scrollTo({
      top:
        document.getElementById(
          "editor"
        ).offsetTop,
      behavior:
        "smooth"
    });

  } catch (error) {

    alert(
      error.message
    );

  }

}


async function saveFile() {

  const path =
    document.getElementById(
      "editPath"
    ).value;

  const content =
    document.getElementById(
      "editContent"
    ).value;

  try {

    await request(
      "/file/save",
      {
        method: "PUT",

        body:
          JSON.stringify({
            repo:
              currentRepo,

            path,

            content,

            sha:
              currentFileSha
          })
      }
    );

    showMessage(
      "editorMessage",
      "File berhasil disimpan.",
      "success"
    );

    await openPath();

  } catch (error) {

    showMessage(
      "editorMessage",
      error.message,
      "error"
    );

  }

}


function closeEditor() {

  document.getElementById(
    "editor"
  ).classList.add(
    "hidden"
  );

}


/* =========================
   PREVIEW
========================= */

async function previewFile(
  path
) {

  try {

    const data =
      await request(
        `/file?repo=${encodeURIComponent(
          currentRepo
        )}&path=${encodeURIComponent(
          path
        )}`
      );

    const content =
      data.data.content || "";

    const win =
      window.open(
        "",
        "_blank"
      );

    if (!win) {

      alert(
        "Popup diblokir browser."
      );

      return;

    }

    win.document.write(`
      <html>
      <head>
        <title>${escapeHtml(path)}</title>

        <style>
          body {
            background:#020617;
            color:#e5e7eb;
            font-family:monospace;
            padding:20px;
          }

          pre {
            white-space:pre-wrap;
            word-break:break-word;
          }
        </style>
      </head>

      <body>
        <h3>${escapeHtml(path)}</h3>

        <pre>${escapeHtml(content)}</pre>
      </body>
      </html>
    `);

    win.document.close();

  } catch (error) {

    alert(
      error.message
    );

  }

}


/* =========================
   RENAME
========================= */

async function renameItem(
  oldPath
) {

  const parts =
    oldPath.split("/");

  const oldName =
    parts.pop();

  const newName =
    prompt(
      "Nama baru:",
      oldName
    );

  if (!newName) return;

  const newPath =
    parts.length
      ? parts.join("/") +
        "/" +
        newName
      : newName;

  try {

    await request(
      "/rename",
      {
        method: "POST",

        body:
          JSON.stringify({
            repo:
              currentRepo,

            oldPath,

            newPath
          })
      }
    );

    await openPath();

  } catch (error) {

    alert(
      error.message
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteItem(
  path,
  sha
) {

  if (
    !confirm(
      "Hapus " +
      path +
      "?"
    )
  ) {
    return;
  }

  try {

    await request(
      "/delete",
      {
        method: "DELETE",

        body:
          JSON.stringify({
            repo:
              currentRepo,

            path,

            sha
          })
      }
    );

    await openPath();

  } catch (error) {

    alert(
      error.message
    );

  }

}


/* =========================
   UPLOAD
========================= */

async function uploadFile() {

  const input =
    document.getElementById(
      "uploadFile"
    );

  const pathInput =
    document.getElementById(
      "uploadPath"
    );

  const file =
    input.files[0];

  if (!file) {

    alert(
      "Pilih file terlebih dahulu."
    );

    return;

  }

  let path =
    pathInput.value.trim();

  if (!path) {

    path =
      currentFolder
        ? currentFolder +
          "/" +
          file.name
        : file.name;

  }

  try {

    showMessage(
      "uploadMessage",
      "Membaca file...",
      "success"
    );

    const base64 =
      await fileToBase64(
        file
      );

    await request(
      "/upload",
      {
        method: "POST",

        body:
          JSON.stringify({
            repo:
              currentRepo,

            path,

            base64,

            message:
              `YasamGit: upload ${path}`
          })
      }
    );

    showMessage(
      "uploadMessage",
      "Upload berhasil.",
      "success"
    );

    input.value = "";

    pathInput.value = "";

    await openPath();

  } catch (error) {

    showMessage(
      "uploadMessage",
      error.message,
      "error"
    );

  }

}


function fileToBase64(
  file
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const result =
            String(
              reader.result
            );

          const comma =
            result.indexOf(",");

          resolve(
            comma === -1
              ? result
              : result.slice(
                  comma + 1
                )
          );

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   SEARCH
========================= */

async function search() {

  const query =
    document.getElementById(
      "searchInput"
    ).value.trim();

  if (!query) return;

  const box =
    document.getElementById(
      "searchResults"
    );

  box.innerHTML =
    "Searching...";

  try {

    const data =
      await request(
        `/search?q=${encodeURIComponent(
          query
        )}`
      );

    box.innerHTML = "";

    if (
      !data.results.length
    ) {

      box.innerHTML =
        "<p>Tidak ditemukan.</p>";

      return;

    }

    data.results.forEach(
      item => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "repo-item";

        div.innerHTML = `
          <div class="item-title">
            ${escapeHtml(
              item.full_name ||
              item.name
            )}
          </div>

          <div class="item-meta">
            ${escapeHtml(
              item.description ||
              item.path ||
              ""
            )}
          </div>

          ${
            item.html_url
              ? `
                <div class="actions">
                  <button
                    onclick="window.open('${escapeJs(item.html_url)}','_blank')"
                  >
                    Open
                  </button>
                </div>
              `
              : ""
          }
        `;

        box.appendChild(
          div
        );

      }
    );

  } catch (error) {

    box.innerHTML =
      `<div class="message show error">
        ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  id,
  message,
  type
) {

  const el =
    document.getElementById(
      id
    );

  el.textContent =
    message;

  el.className =
    "message show " +
    type;

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}
